# Deploy to DigitalOcean droplet via SSH
name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:

      - name: Install SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} 'bash -s' << 'DEPLOY_SCRIPT'
          set -eo pipefail
          cd /var/www/sendora

          echo "======================================"
          echo "DEPLOYMENT STARTED - $(date)"
          echo "======================================"

          # 1. Pull latest code
          echo "--- Pulling latest code ---"
          git fetch origin main
          git reset --hard origin/main
          echo "Code updated: $(git log -1 --oneline)"

          # 2. Install PHP dependencies
          echo "--- Installing Composer dependencies ---"
          composer install --no-dev --optimize-autoloader --no-interaction 2>&1 | tail -5

          # 3. Install frontend dependencies and build
          echo "--- Building frontend assets ---"
          npm install --legacy-peer-deps 2>&1 | tail -10
          npm run build 2>&1 | tail -10

          # 4. Run migrations
          echo "--- Running migrations ---"
          php artisan migrate --force 2>&1 | tail -5

          # 5. Clear and rebuild caches
          echo "--- Optimizing Laravel ---"
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # 6. Fix storage directories, permissions and symlink
          echo "--- Setting up storage ---"
          # Create upload directories in case they don't exist yet
          mkdir -p storage/app/public/campaigns
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          # Directories need 775: owner+group can write, world can read+traverse
          find storage -type d -exec chmod 775 {} \;
          find bootstrap/cache -type d -exec chmod 775 {} \;
          # Files need 664: world-readable so Nginx can serve them
          find storage/app/public -type f -exec chmod 664 {} \;
          # Always force-recreate the symlink (fixes broken/stale symlinks)
          php artisan storage:link --force
          echo "Storage symlink: $(readlink public/storage)"

          # 7. Configure WhatsApp server
          echo "--- Configuring WhatsApp server ---"
          cat > whatsapp-server-temp/.env << 'WAEOF'
          PORT=3005
          API_BASE_URL=https://sendora.cc
          WAEOF

          # Install WhatsApp server deps if needed
          cd whatsapp-server-temp
          if [ ! -d node_modules ] || [ package.json -nt node_modules ]; then
            npm install --no-audit --no-fund 2>&1 | tail -5
          fi
          cd /var/www/sendora

          # 8. Update database settings
          echo "--- Updating database settings ---"
          php -r "
          require __DIR__.'/vendor/autoload.php';
          \$app = require_once __DIR__.'/bootstrap/app.php';
          \$app->make('Illuminate\Contracts\Console\Kernel')->bootstrap();
          \App\Models\Setting::updateOrCreate(['key' => 'wa_server_url'], ['value' => 'http://127.0.0.1:3005']);
          \App\Models\Setting::updateOrCreate(['key' => 'app_url'], ['value' => 'https://sendora.cc']);
          echo 'Settings updated';
          " || echo "Settings update failed (non-critical)"

          # 9. Restart services via systemd
          echo "--- Restarting services ---"
          sudo systemctl restart sendora-wa
          sudo systemctl restart sendora-queue

          # 10. Health check
          echo "--- Health check ---"
          sleep 3
          if curl -s --max-time 5 http://127.0.0.1:3005/health > /dev/null 2>&1; then
            echo "WhatsApp server: healthy"
          else
            echo "WhatsApp server: waiting for startup..."
            sleep 5
            curl -s --max-time 5 http://127.0.0.1:3005/health > /dev/null 2>&1 && echo "WhatsApp server: healthy" || echo "WARNING: WhatsApp server not responding (systemd will keep restarting)"
          fi

          echo "======================================"
          echo "DEPLOYMENT COMPLETED - $(date)"
          echo "======================================"
          DEPLOY_SCRIPT

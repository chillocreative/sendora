name: Deploy to cPanel (SSH/Rsync)
# Trigger: SSH Key Update

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer:v2

      - name: 📦 Install PHP Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install & Build Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: � Archive Build Artifacts
        run: |
          zip -r deploy.zip app bootstrap config database public resources routes whatsapp-server-temp vendor composer.json composer.lock package.json artisan package-lock.json vite.config.js postcss.config.js tailwind.config.js -x "*.git*" "storage/*" "node_modules/*"

      - name: 📂 Upload Archive (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy.zip"
          target: ${{ secrets.REMOTE_TARGET }}

      - name: 🚀 Deploy & Configure via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.REMOTE_TARGET }}
            
            # 1. Extract Archive
            if [ -f "deploy.zip" ]; then
              echo "Extracting deployment archive..."
              unzip -o deploy.zip
              rm deploy.zip
            fi

            # 2. Update Permissions
            chmod -R 755 storage bootstrap/cache
            
            # 3. Sync to public_html if it exists and is not a symlink to public
            if [ -d "public_html" ] && [ ! -L "public_html" ]; then
              echo "Syncing public to public_html directory..."
              rsync -avz --delete public/ public_html/
            fi
            
            # 4. Migrate & Clear Cache (EXPLICIT)
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/routes-v7.php
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link --force || true
            
            # 5. Update Database Settings
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'wa_server_url'], ['value' => 'http://127.0.0.1:3005'])"
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'app_url'], ['value' => 'https://sendora.cc'])"

            # 6. Configure & Restart WhatsApp Server
            cd whatsapp-server-temp
            
            export PATH="/opt/alt/alt-nodejs24/root/usr/bin:$PATH"
            
            echo "Killing ghost WhatsApp processes..."
            pkill -f "server.js" || true
            pkill -f "lsnode.*whatsapp-server" || true
            sleep 2
            
            mkdir -p sessions
            chmod -R 777 sessions
            
            # Install Node dependencies
            echo "Installing Node dependencies..."
            /opt/alt/alt-nodejs24/root/usr/bin/npm install --no-audit --no-fund
            
            echo "WA_SERVER_PORT=3005" > .env
            echo "API_BASE_URL=http://127.0.0.1" >> .env
            > server.log
            
            mkdir -p tmp
            touch tmp/restart.txt
            
            cd ..
            mkdir -p whatsapp-server-temp/tmp
            touch whatsapp-server-temp/tmp/restart.txt
            
            echo "✅ Deployment SUCCESS!"

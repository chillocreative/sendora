name: Deploy to cPanel (SSH/Rsync)
# Trigger: SSH Key Update

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer:v2

      - name: 📦 Install PHP Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install & Build Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📦 Archive Build Artifacts
        run: |
          if [ ! -d "vendor" ]; then echo "Error: vendor directory missing!"; exit 1; fi
          tar -czf deploy.tar.gz app bootstrap config database public resources routes whatsapp-server-temp vendor composer.json composer.lock package.json artisan package-lock.json vite.config.js postcss.config.js tailwind.config.js

      - name: 📂 Upload Archive (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: ${{ secrets.REMOTE_TARGET }}

      - name: 🚀 Deploy & Configure via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            echo "--- STARTING RESILIENT DEPLOYMENT ---"
            cd ${{ secrets.REMOTE_TARGET }} || { echo "❌ Could not enter target directory"; exit 1; }
            
            echo "Step 1: Extracting Archive..."
            if [ -f "deploy.tar.gz" ]; then
              tar -xzf deploy.tar.gz && echo "✅ Extraction successful" || echo "⚠️ Extraction had issues but continuing..."
              rm -f deploy.tar.gz
            else
              echo "❌ Archive not found!"
            fi

            echo "Step 2: Setting Permissions..."
            chmod -R 755 storage bootstrap/cache || true
            
            echo "Step 3: Discovering Environment..."
            # Try to find the best PHP version
            PHP_BIN=$(which php83 2>/dev/null || which php8.3 2>/dev/null || which php 2>/dev/null)
            NODE_BIN="/opt/alt/alt-nodejs24/root/usr/bin/node"
            NPM_BIN="/opt/alt/alt-nodejs24/root/usr/bin/npm"
            echo "Using PHP: $PHP_BIN"
            echo "Using Node: $NODE_BIN"

            echo "Step 4: Syncing Public Files..."
            if [ -d "public_html" ] && [ ! -L "public_html" ] && [ -d "public" ]; then
              rsync -avz --quiet public/ public_html/ && echo "✅ Sync complete"
            fi
            
            echo "Step 5: Laravel Maintenance..."
            $PHP_BIN artisan optimize:clear || true
            $PHP_BIN artisan migrate --force || true
            $PHP_BIN artisan storage:link --force || true
            
            echo "Step 6: Updating WhatsApp Configuration..."
            $PHP_BIN artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'wa_server_url'], ['value' => 'http://127.0.0.1:3005'])"
            $PHP_BIN artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'app_url'], ['value' => 'https://sendora.cc'])"

            echo "Step 7: Managing WhatsApp Server..."
            if [ -d "whatsapp-server-temp" ]; then
              cd whatsapp-server-temp
              
              echo "Killing old processes safely..."
              pkill -9 -f "server.js" || true
              pkill -9 -u $(whoami) lsnode || true
              
              mkdir -p sessions
              chmod -R 777 sessions
              
              echo "Installing Node dependencies..."
              export PATH="/opt/alt/alt-nodejs24/root/usr/bin:$PATH"
              $NPM_BIN install --no-audit --no-fund --quiet || echo "⚠️ NPM install had issues"
              
              echo "Generating configs..."
              echo "WA_SERVER_PORT=3005" > .env
              echo "API_BASE_URL=http://127.0.0.1" >> .env
              > server.log
              
              echo "Triggering Server Restart..."
              mkdir -p tmp
              touch tmp/restart.txt
              
              echo "✅ WHATSAPP SERVER READY ON PORT 3005"
            else
              echo "❌ whatsapp-server-temp directory missing!"
            fi
            
            echo "--- DEPLOYMENT FINISHED ---"

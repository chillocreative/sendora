name: Deploy to cPanel (SSH/Rsync)
# Trigger: SSH Key Update

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer:v2

      - name: 📦 Install PHP Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install & Build Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📂 Upload Build Artifacts (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "public/build"
          target: ${{ secrets.REMOTE_TARGET }}

      - name: 🚀 Deploy & Configure via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.REMOTE_TARGET }}
            
            # 1. Pull latest code
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Migrate & optimize
            # Note: We uploaded public/build via SCP, so no need to build on server.
            
            php artisan optimize:clear
            php artisan route:clear
            php artisan route:cache
            php artisan config:cache
            php artisan view:cache
            
            php artisan migrate --force
            php artisan storage:link || true
            
            # 3. Configure Node Environment
            if [ ! -f "whatsapp-server-temp/.env" ]; then
              echo "WA_SERVER_PORT=3000" > whatsapp-server-temp/.env
              echo "API_BASE_URL=https://sendora.cc" >> whatsapp-server-temp/.env
            else
              sed -i 's|API_BASE_URL=.*|API_BASE_URL=https://sendora.cc|' whatsapp-server-temp/.env
            fi

            # 4. Update Database Settings (CRITICAL: Use Local Loopback for Stability)
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'wa_server_url'], ['value' => 'http://127.0.0.1:3000'])"
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'app_url'], ['value' => 'https://sendora.cc'])"

            # 5. Restart Node Engine (Passenger)
            mkdir -p whatsapp-server-temp/tmp
            touch whatsapp-server-temp/tmp/restart.txt

            echo "Deployment complete!"

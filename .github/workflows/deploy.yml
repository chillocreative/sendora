name: Deploy to cPanel (SSH/Rsync)
# Trigger: SSH Key Update

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer:v2

      - name: 📦 Install PHP Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install & Build Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📦 Archive Build Artifacts
        run: |
          if [ ! -d "vendor" ]; then echo "Error: vendor directory missing!"; exit 1; fi
          tar -czf deploy.tar.gz app bootstrap config database public resources routes whatsapp-server-temp vendor composer.json composer.lock package.json artisan package-lock.json vite.config.js postcss.config.js tailwind.config.js

      - name: 📂 Upload Archive (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: ${{ secrets.REMOTE_TARGET }}

      - name: 🚀 Deploy & Configure via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.REMOTE_TARGET }}
            echo "Working in: $(pwd)"
            
            # 1. Extract Archive
            if [ -f "deploy.tar.gz" ]; then
              echo "Extracting tarball..."
              tar -xzf deploy.tar.gz
              rm deploy.tar.gz
            else
              echo "❌ Error: deploy.tar.gz NOT FOUND on server!"
              exit 1
            fi

            # 2. Permissions
            chmod -R 755 storage bootstrap/cache
            
            # 3. Sync Public
            if [ -d "public_html" ] && [ ! -L "public_html" ]; then
              echo "Syncing to public_html..."
              rsync -avz --quiet public/ public_html/
            fi
            
            # 4. Laravel Maintenance
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link --force || true
            
            # 5. WhatsApp Connection Settings
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'wa_server_url'], ['value' => 'http://127.0.0.1:3005'])"
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'app_url'], ['value' => 'https://sendora.cc'])"

            # 6. Node Server Management
            cd whatsapp-server-temp
            export PATH="/opt/alt/alt-nodejs24/root/usr/bin:$PATH"
            
            echo "Resetting WhatsApp process..."
            pkill -f "server.js" || true
            pkill -u $(whoami) lsnode || true
            
            mkdir -p sessions
            chmod -R 777 sessions
            
            # Install Node deps (quietly)
            /opt/alt/alt-nodejs24/root/usr/bin/npm install --no-audit --no-fund --quiet
            
            # Refresh Config
            echo "WA_SERVER_PORT=3005" > .env
            echo "API_BASE_URL=http://127.0.0.1" >> .env
            > server.log
            
            # Passenger Restart
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "✅ DEPLOYMENT COMPLETE"

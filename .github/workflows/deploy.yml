name: Deploy to cPanel (SSH Only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest
    steps:

      - name: 🚀 Deploy & Configure via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.REMOTE_TARGET }} || { echo "❌ Failed to cd to target directory"; exit 1; }

            echo "======================================"
            echo "🚀 DEPLOYMENT STARTED"
            echo "======================================"
            echo "Target: ${{ secrets.REMOTE_TARGET }}"
            echo "Time: $(date)"
            echo ""

            # 1. Pull latest code
            echo "📥 Step 1: Pulling latest code..."
            if [ -d .git ]; then
              git fetch origin main || git fetch --all || { echo "❌ Git fetch failed"; exit 1; }
              git reset --hard origin/main || git reset --hard FETCH_HEAD || { echo "❌ Git reset failed"; exit 1; }
              echo "✅ Code updated: $(git log -1 --oneline)"
            else
              echo "❌ ERROR: Not a git repository!"
              echo "Please initialize git in your cPanel directory:"
              echo "  cd ${{ secrets.REMOTE_TARGET }}"
              echo "  git init"
              echo "  git remote add origin git@github.com:chillocreative/sendora.git"
              echo "  git fetch origin main"
              echo "  git checkout -b main origin/main"
              exit 1
            fi
            echo ""

            # 2. Install Composer dependencies
            echo "📦 Step 2: Installing Composer dependencies..."
            if command -v composer &> /dev/null; then
              composer install --no-dev --optimize-autoloader --no-interaction 2>&1 | tail -5 || echo "⚠️ Composer had issues"
              echo "✅ Composer dependencies installed"
            else
              echo "⚠️ Composer not found, skipping PHP dependencies"
            fi
            echo ""

            # 3. Find Node.js
            echo "🔍 Step 3: Locating Node.js..."
            NODE_BIN=""
            NPM_BIN=""

            # Search for node and npm
            for base_path in /opt/alt/alt-nodejs*/root/usr/bin /usr/local/bin /usr/bin ~/.nvm/versions/node/*/bin; do
              for node_path in $base_path; do
                if [ -f "$node_path/node" ]; then
                  NODE_BIN="$node_path/node"
                  NPM_BIN="$node_path/npm"
                  export PATH="$node_path:$PATH"
                  break 2
                fi
              done
            done

            if [ -n "$NODE_BIN" ]; then
              echo "✅ Found Node.js: $($NODE_BIN --version)"
              echo "✅ Found NPM: $($NPM_BIN --version)"
            else
              echo "❌ Node.js not found!"
              echo "Please install Node.js in cPanel or update the PATH"
              exit 1
            fi
            echo ""

            # 4. Build frontend assets
            echo "🔨 Step 4: Building frontend assets..."
            $NPM_BIN install --legacy-peer-deps 2>&1 | tail -10 || echo "⚠️ npm install had issues"
            $NPM_BIN run build 2>&1 | tail -10 || { echo "❌ Build failed"; exit 1; }
            echo "✅ Assets built successfully"
            echo ""

            # 5. Laravel optimizations
            echo "⚙️ Step 5: Running Laravel optimizations..."
            php artisan optimize:clear 2>&1 | head -5 || echo "⚠️ Cache clear had issues"
            php artisan config:cache || echo "⚠️ Config cache had issues"
            php artisan route:cache || echo "⚠️ Route cache had issues"
            php artisan view:cache || echo "⚠️ View cache had issues"
            echo "✅ Laravel optimized"
            echo ""

            # 6. Run migrations
            echo "🗄️ Step 6: Running database migrations..."
            php artisan migrate --force 2>&1 | tail -5 || echo "⚠️ Migration had issues"
            echo "✅ Migrations completed"
            echo ""

            # 7. Storage link
            echo "🔗 Step 7: Creating storage symlink..."
            if [ ! -L public/storage ]; then
              php artisan storage:link || echo "⚠️ Storage link failed"
              echo "✅ Storage link created"
            else
              echo "✅ Storage link already exists"
            fi
            echo ""

            # 8. Configure WhatsApp Server
            echo "📱 Step 8: Configuring WhatsApp server..."
            mkdir -p whatsapp-server-temp
            cat > whatsapp-server-temp/.env << 'ENVEOF'
            PORT=3005
            API_BASE_URL=https://sendora.cc
            ENVEOF
            echo "✅ WhatsApp .env configured"
            echo ""

            # 9. Update database settings
            echo "💾 Step 9: Updating database settings..."
            php -r "
            require __DIR__.'/vendor/autoload.php';
            \$app = require_once __DIR__.'/bootstrap/app.php';
            \$app->make('Illuminate\Contracts\Console\Kernel')->bootstrap();
            \App\Models\Setting::updateOrCreate(['key' => 'wa_server_url'], ['value' => 'https://sendora.cc/whatsapp-server-temp']);
            \App\Models\Setting::updateOrCreate(['key' => 'app_url'], ['value' => 'https://sendora.cc']);
            echo 'Settings updated';
            " || echo "⚠️ Settings update failed"
            echo "✅ Step 9 done"
            echo ""

            # 10. Setup WhatsApp server
            echo "🔄 Step 10: Setting up WhatsApp server..."
            kill $(pgrep -f "node.*server\.js" 2>/dev/null) 2>/dev/null || echo "No existing node processes"

            cd whatsapp-server-temp
            if [ -d node_modules ]; then
              echo "✅ node_modules already exists, skipping npm install"
            else
              $NPM_BIN install --no-audit --no-fund --prefer-offline 2>&1 | tail -5 || echo "⚠️ WhatsApp npm install had issues"
            fi

            mkdir -p tmp
            touch tmp/restart.txt
            echo "✅ WhatsApp server configured"

            cd ${{ secrets.REMOTE_TARGET }}
            echo ""

            echo "======================================"
            echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY!"
            echo "======================================"
            echo "Commit: ${{ github.sha }}"
            echo "Deployed: $(date)"
            echo "======================================"





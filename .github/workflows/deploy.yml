name: Deploy to cPanel (SSH/Rsync)
# Trigger: SSH Key Update

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer:v2

      - name: 📦 Install PHP Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install & Build Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📂 Upload Build Artifacts & Key Files (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "app,bootstrap,config,database,public,resources,routes,whatsapp-server-temp,composer.json,composer.lock,package.json,artisan,package-lock.json,vite.config.js,postcss.config.js,tailwind.config.js"
          target: ${{ secrets.REMOTE_TARGET }}

      - name: 🚀 Deploy & Configure via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.REMOTE_TARGET }}
            
            # 1. Update Permissions
            chmod -R 755 storage bootstrap/cache
            
            # 2. Sync to public_html if it exists and is not a symlink to public
            if [ -d "public_html" ] && [ ! -L "public_html" ]; then
              echo "Syncing public to public_html directory..."
              rsync -avz --delete public/ public_html/
            fi
            
            # 3. Dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # 3. Migrate & Clear Cache (EXPLICIT)
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/routes-v7.php
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            
            # 4. Update Database Settings (CRITICAL: Use Local Loopback for Stability)
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'wa_server_url'], ['value' => 'http://127.0.0.1:3000'])"
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'app_url'], ['value' => 'https://sendora.cc'])"

            # 5. Configure & Restart WhatsApp Server
            cd whatsapp-server-temp
            npm install --production
            
            # Ensure .env is correct for Node
            echo "WA_SERVER_PORT=3000" > .env
            echo "API_BASE_URL=https://sendora.cc" >> .env
            
            # Clear old log to keep it fresh
            > server.log
            
            # Restart Passenger (Node Server)
            mkdir -p tmp
            touch tmp/restart.txt
            
            # Also trigger restart from root just in case
            cd ..
            mkdir -p whatsapp-server-temp/tmp
            touch whatsapp-server-temp/tmp/restart.txt
            
            echo "Deployment SUCCESS!"

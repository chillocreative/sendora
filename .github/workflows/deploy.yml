name: Deploy to cPanel (SSH/Rsync)
# Trigger: SSH Key Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-deploy:
    name: 🎉 Deploy via SSH
    runs-on: ubuntu-latest
    steps:

      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          tools: composer:v2

      - name: 📦 Install PHP Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install & Build Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📂 Upload Build Artifacts (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "public/build"
          target: ${{ secrets.REMOTE_TARGET }}

      - name: 🚀 Deploy & Configure via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.REMOTE_TARGET }}
            set -e

            # 1. Pull latest code
            echo "Pulling latest code using token..."
            # Using the token directly in the URL is the most compatible way for cPanel git versions
            git fetch --depth=1 "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
            git reset --hard FETCH_HEAD
            
            # 2. Migrate & optimize
            php artisan optimize:clear
            php artisan migrate --force
            
            if [ ! -L public/storage ]; then
                php artisan storage:link || true
            fi
            
            # 3. Configure Node Environment
            echo "WA_SERVER_PORT=3005" > whatsapp-server-temp/.env
            echo "API_BASE_URL=http://127.0.0.1" >> whatsapp-server-temp/.env

            # 4. Update Database Settings
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'wa_server_url'], ['value' => 'http://127.0.0.1:3005'])"
            php artisan tinker --execute="\App\Models\Setting::updateOrCreate(['key' => 'app_url'], ['value' => 'https://sendora.cc'])"

            # 5. Management of Node Server
            echo "Cleaning up WhatsApp processes..."
            # Kill specifically the node processes running server.js
            pgrep -f "node.*server.js" | xargs kill -9 || true

            cd whatsapp-server-temp
            export PATH="/opt/alt/alt-nodejs24/root/usr/bin:$PATH"
            /opt/alt/alt-nodejs24/root/usr/bin/npm install --no-audit --no-fund --quiet || echo "⚠️ NPM issues"
            
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "✅ Deployment successful!"



